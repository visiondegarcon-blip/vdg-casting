<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VDG — Casting Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   TOKENS & RESET
============================================================ */
:root {
  --black:    #0c0c0c;
  --off:      #ffffff;
  --surface:  #f8f8f6;
  --border:   #e2e2de;
  --muted:    #d4d4ce;
  --text-dim: #999992;
  --text:     #1a1a18;
  --white:    #ffffff;
  --accent:   #0c0c0c;
  --accent2:  #c0392b;
  --blue:     #2c5282;
  --radius:   3px;
  --font-display: 'Cormorant Garamond', serif;
  --font-body:    'Instrument Sans', sans-serif;
  --font-mono:    'DM Mono', monospace;
  --sidebar: 240px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: var(--white);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: var(--font-body); }
input, select, textarea {
  font-family: var(--font-body);
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  padding: 10px 14px;
  width: 100%;
  font-size: 14px;
  transition: border-color .2s;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--black); }
select option { background: var(--white); color: var(--text); }
label { font-size: 11px; color: var(--text-dim); letter-spacing: .08em; text-transform: uppercase; font-weight: 500; display: block; margin-bottom: 6px; }
.hidden { display: none !important; }

/* ============================================================
   AUTH SCREEN
============================================================ */
#auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--white);
  position: relative;
  overflow: hidden;
}
#auth-screen::before {
  content: 'VDG';
  position: absolute;
  font-family: var(--font-display);
  font-size: clamp(180px, 30vw, 420px);
  color: transparent;
  -webkit-text-stroke: 1px #ebebeb;
  letter-spacing: .02em;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  white-space: nowrap;
  font-weight: 300;
}
.auth-card {
  width: 100%;
  max-width: 400px;
  padding: 52px 44px;
  background: var(--white);
  border: 1px solid var(--border);
  position: relative;
  z-index: 2;
}
.auth-logo {
  font-family: var(--font-display);
  font-size: 48px;
  letter-spacing: .1em;
  color: var(--black);
  margin-bottom: 2px;
  font-weight: 300;
  line-height: 1;
}
.auth-sub {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 44px;
  font-family: var(--font-mono);
  font-weight: 300;
}
.auth-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 32px;
  border-bottom: 1px solid var(--border);
}
.auth-tab {
  flex: 1;
  padding: 10px 0;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  transition: all .2s;
}
.auth-tab.active { color: var(--black); border-bottom-color: var(--black); }
.form-group { margin-bottom: 20px; }
.btn {
  width: 100%;
  padding: 13px;
  background: var(--black);
  color: var(--white);
  border: none;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  transition: opacity .2s, transform .1s;
  margin-top: 8px;
}
.btn:hover { opacity: .8; }
.btn:active { transform: scale(.99); }
.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-ghost:hover { border-color: var(--black); color: var(--black); background: none; opacity: 1; }
.btn-sm {
  width: auto;
  padding: 7px 16px;
  font-size: 11px;
}
.btn-danger { background: var(--accent2); }
.auth-msg { font-size: 13px; color: var(--text-dim); text-align: center; margin-top: 16px; }
.auth-msg span { color: var(--black); cursor: pointer; }
.error-msg { color: var(--accent2); font-size: 12px; margin-top: 10px; min-height: 18px; font-family: var(--font-mono); }
.role-note { font-size: 11px; color: var(--text-dim); margin-top: 8px; line-height: 1.6; font-family: var(--font-mono); }

/* ============================================================
   APP SHELL
============================================================ */
#app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar);
  background: var(--black);
  border-right: none;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform .3s;
}
.sidebar-logo {
  padding: 32px 28px 24px;
  font-family: var(--font-display);
  font-size: 32px;
  letter-spacing: .12em;
  color: var(--white);
  border-bottom: 1px solid rgba(255,255,255,.08);
  font-weight: 300;
}
.sidebar-event {
  padding: 12px 28px;
  font-size: 10px;
  color: rgba(255,255,255,.35);
  font-family: var(--font-mono);
  letter-spacing: .08em;
  border-bottom: 1px solid rgba(255,255,255,.06);
  font-weight: 300;
}
.sidebar-nav { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 2px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.4);
  cursor: pointer;
  transition: all .15s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  letter-spacing: .02em;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.8); }
.nav-item.active { background: rgba(255,255,255,.1); color: var(--white); }
.nav-icon { font-size: 14px; width: 18px; text-align: center; opacity: .6; }
.sidebar-user {
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--white); }
.user-role { font-size: 10px; color: rgba(255,255,255,.35); font-family: var(--font-mono); letter-spacing: .06em; }
.signout-btn {
  background: none;
  border: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.4);
  border-radius: 2px;
  padding: 5px 10px;
  font-size: 11px;
  transition: all .2s;
  letter-spacing: .04em;
}
.signout-btn:hover { border-color: rgba(255,255,255,.4); color: rgba(255,255,255,.8); }

/* Main content */
.main {
  margin-left: var(--sidebar);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
}
.topbar {
  padding: 20px 36px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--white);
  z-index: 50;
}
.topbar-title { font-family: var(--font-display); font-size: 28px; letter-spacing: .06em; font-weight: 400; color: var(--black); }
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.content { padding: 36px; flex: 1; }

/* ============================================================
   STATS ROW
============================================================ */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; margin-bottom: 36px; background: var(--border); border: 1px solid var(--border); }
.stat-card {
  background: var(--white);
  padding: 24px 20px;
}
.stat-num { font-family: var(--font-display); font-size: 44px; color: var(--black); line-height: 1; font-weight: 400; }
.stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; font-family: var(--font-mono); }

/* ============================================================
   FILTERS
============================================================ */
.filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-bar input, .filter-bar select { width: auto; min-width: 180px; flex: 1; background: var(--white); }
.filter-chip {
  padding: 7px 16px;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.filter-chip.active { background: var(--black); border-color: var(--black); color: var(--white); }

/* ============================================================
   MODEL GRID
============================================================ */
.model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1px; background: var(--border); }
.model-card {
  background: var(--white);
  overflow: hidden;
  transition: background .15s;
  cursor: pointer;
}
.model-card:hover { background: var(--surface); }
.model-card.approved { border-left: 3px solid var(--black); }
.card-header {
  padding: 20px 22px 14px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.card-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--black);
  flex-shrink: 0;
  overflow: hidden;
}
.card-avatar img { width: 100%; height: 100%; object-fit: cover; }
.card-name-block { flex: 1; min-width: 0; }
.card-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
.card-handle { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); margin-top: 1px; }
.card-status { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 2px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  font-family: var(--font-mono);
}
.badge-approved { background: var(--black); color: var(--white); }
.badge-pending { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
.badge-gender-male { background: #eef2f7; color: #2c5282; }
.badge-gender-female { background: #fdf2f8; color: #862e6c; }
.badge-ethnicity { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
.badge-agency { background: #fefce8; color: #92400e; border: 1px solid #fde68a; }
.card-body { padding: 0 22px 16px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.tag {
  padding: 2px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 10px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.tag-custom {
  background: var(--black);
  color: var(--white);
  border-color: var(--black);
}
.card-detail-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 5px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--surface);
}
.card-detail-row:last-child { border-bottom: none; }
.card-detail-row span:last-child { color: var(--text); text-align: right; font-weight: 500; }
.card-footer {
  padding: 12px 22px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--surface);
}
.stylist-assign {
  flex: 1;
  min-width: 100px;
  font-size: 12px;
  padding: 6px 10px;
  background: var(--white);
}
.approve-btn {
  padding: 6px 14px;
  border-radius: 2px;
  border: 1px solid var(--black);
  background: none;
  color: var(--black);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  transition: all .15s;
  white-space: nowrap;
  font-family: var(--font-mono);
}
.approve-btn:hover { background: var(--black); color: var(--white); }
.approve-btn.approved-state { background: var(--black); color: var(--white); }
.talent-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: #eef2f7;
  border: 1px solid #c3dafe;
  color: #2c5282;
  border-radius: 2px;
  font-size: 10px;
  font-family: var(--font-mono);
}

/* ============================================================
   MODEL DETAIL MODAL
============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(12,12,12,.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(6px);
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--white);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 700px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  padding: 28px 32px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--white);
  z-index: 1;
}
.modal-close {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}
.modal-close:hover { border-color: var(--black); color: var(--black); }
.modal-body { padding: 28px 32px; }
.modal-section { margin-bottom: 28px; }
.modal-section-title {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.detail-item label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
.detail-item .val { font-size: 14px; color: var(--text); }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.photo-thumb {
  aspect-ratio: 3/4;
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: hidden;
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-upload-area {
  border: 1px dashed var(--border);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  background: var(--surface);
}
.photo-upload-area:hover { border-color: var(--black); background: var(--white); }
.photo-upload-area input { display: none; }
.notes-area textarea { min-height: 80px; resize: vertical; }
.tag-input-row { display: flex; gap: 8px; }
.tag-input-row input { flex: 1; }
.tags-display { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag-remove {
  background: var(--black);
  color: var(--white);
  border: none;
  border-radius: 2px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
}
.tag-remove span.x { font-size: 13px; cursor: pointer; opacity: .5; }

/* ============================================================
   INVENTORY PAGE
============================================================ */
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--border); }
.inv-card {
  background: var(--white);
  padding: 20px;
}
.inv-card-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.inv-card-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; font-family: var(--font-mono); }
.inv-assigned { font-size: 12px; color: var(--black); font-family: var(--font-mono); font-weight: 500; }
.add-inv-btn {
  width: 100%;
  padding: 40px 20px;
  border: 1px dashed var(--border);
  background: var(--white);
  color: var(--text-dim);
  font-size: 13px;
  font-family: var(--font-body);
  transition: all .2s;
  cursor: pointer;
  letter-spacing: .04em;
}
.add-inv-btn:hover { border-color: var(--black); color: var(--black); }

/* ============================================================
   MODEL SELF-VIEW
============================================================ */
.model-profile-card {
  max-width: 600px;
  margin: 0 auto;
  background: var(--white);
  border: 1px solid var(--border);
}
.model-profile-header {
  background: var(--black);
  padding: 36px;
  display: flex;
  align-items: center;
  gap: 24px;
  border-bottom: none;
}
.profile-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 28px;
  color: var(--white);
  overflow: hidden;
  flex-shrink: 0;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-name { font-family: var(--font-display); font-size: 30px; letter-spacing: .06em; color: var(--white); font-weight: 300; }
.profile-handle { font-size: 12px; color: rgba(255,255,255,.4); font-family: var(--font-mono); }
.profile-status-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.model-profile-body { padding: 32px 36px; }

/* ============================================================
   ROSTER PAGE
============================================================ */
.roster-card {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.roster-card:first-child { border-top: 1px solid var(--border); }
.roster-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--black);
  flex-shrink: 0;
}
.roster-info { flex: 1; min-width: 0; }
.roster-name { font-weight: 600; font-size: 14px; }
.roster-handle { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
.roster-list { display: flex; flex-direction: column; }

/* ============================================================
   TOAST
============================================================ */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--black);
  border: none;
  color: var(--white);
  padding: 12px 20px;
  font-size: 13px;
  font-weight: 500;
  z-index: 999;
  transform: translateY(100px);
  opacity: 0;
  transition: all .3s;
  max-width: 280px;
  letter-spacing: .02em;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.error { background: var(--accent2); }

/* ============================================================
   MOBILE MENU
============================================================ */
.mob-topbar {
  display: none;
  padding: 14px 20px;
  background: var(--black);
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 150;
}
.mob-logo { font-family: var(--font-display); font-size: 26px; color: var(--white); letter-spacing: .12em; font-weight: 300; }
.hamburger { background: none; border: none; color: var(--white); font-size: 22px; }
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 99;
}

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .main { margin-left: 0; }
  .mob-topbar { display: flex; }
  .topbar { display: none; }
  .content { padding: 20px 16px; }
  .model-grid { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }

async function loadUser(user) {

  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('sidebar-username').textContent = meta.display_name || user.email;
  document.getElementById('sidebar-userrole').textContent = roleLabel(currentRole, meta);

  buildNav();
  await fetchModelData();
  navigateTo(defaultPage());

function roleLabel(role, meta) {
  if (role === 'admin') return 'Admin';
  if (role === 'staff') return meta.staff_title || 'Staff';
  return 'Model';

function defaultPage() {
  if (currentRole === 'admin' || currentRole === 'staff') return 'dashboard';
  return 'my-profile';

============================================================ */
async function fetchModelData() {
  const { data, error } = await sb.from('model_profiles').select('*');
  if (data) {
    data.forEach(r => { modelData[r.model_name] = r; });
  }
}

async function fetchInventory() {
  const { data } = await sb.from('inventory').select('*');
  inventoryData = data || [];
}

async function upsertModelProfile(name, updates) {
  const existing = modelData[name] || {};
  const payload = { model_name: name, ...existing, ...updates, updated_at: new Date().toISOString() };
  const { error } = await sb.from('model_profiles').upsert(payload, { onConflict: 'model_name' });
  if (!error) { modelData[name] = payload; }
  return !error;
}

async function upsertInventoryItem(item) {
  const { error } = await sb.from('inventory').upsert(item, { onConflict: 'id' });
  await fetchInventory();
  return !error;
}

  let items = [];

    items = [
      { id: 'dashboard', icon: '◈', label: 'Dashboard' },
      { id: 'models', icon: '◉', label: 'All Models' },
      { id: 'inventory', icon: '◫', label: 'Inventory' },
    ];
  }
  if (currentRole === 'model' || currentRole === 'admin') {
    items.push({ id: 'my-profile', icon: '◎', label: 'My Profile' });
  }
  if (currentRole === 'model') {
    items.push({ id: 'roster', icon: '◉', label: 'The Roster' });
  }

  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.id = 'nav-' + item.id;
    btn.innerHTML = `<span class="nav-icon">${item.icon}</span>${item.label}`;
    btn.onclick = () => navigateTo(item.id);
    nav.appendChild(btn);
  });
}

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav-' + page);
  if (btn) btn.classList.add('active');

  const titleMap = { dashboard: 'Dashboard', models: 'All Models', inventory: 'Inventory', 'my-profile': 'My Profile', roster: 'The Roster' };
  document.getElementById('topbar-title').textContent = titleMap[page] || '';

  const content = document.getElementById('page-content');
  if (page === 'dashboard') renderDashboard(content);
  else if (page === 'models') renderModels(content);
  else if (page === 'inventory') renderInventory(content);
  else if (page === 'my-profile') renderMyProfile(content);
  else if (page === 'roster') renderRoster(content);

  // mobile: close sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

function renderModelCards() {
  let filtered = MODEL_ROSTER.filter(m => {
    const db = modelData[m.name] || {};
    if (filterGender && m.gender !== filterGender) return false;
    if (filterEthnicity && !m.ethnicity.includes(filterEthnicity)) return false;
    if (filterStatus === 'approved' && !db.approved) return false;
    if (filterStatus === 'pending' && db.approved) return false;
    if (filterStatus === 'cultural' && !m.cultural_piece) return false;
    if (filterStatus === 'talent' && !m.talent) return false;
    if (filterStatus === 'busy' && m.free_5july) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!m.name.toLowerCase().includes(q) && !m.handle.toLowerCase().includes(q) && !m.suburb.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const grid = document.getElementById('model-grid');
  if (!grid) return;
  grid.innerHTML = filtered.map(m => modelCard(m)).join('');
}

  return `
    <div class="model-card ${approved?'approved':''}" onclick="openModal('${m.name}')">
      <div class="card-header">
        <div class="card-avatar">${db.avatar_url ? `<img src="${db.avatar_url}" alt=""/>` : initials}</div>
        <div class="card-name-block">
          <div class="card-name">${m.name}</div>
          <div class="card-handle">@${m.handle || '—'}</div>
        </div>
        <div class="card-status">
          <span class="badge ${approved?'badge-approved':'badge-pending'}">${approved?'✓ Approved':'Pending'}</span>
          <span class="badge ${m.gender==='Male'?'badge-gender-male':'badge-gender-female'}">${m.gender}</span>
        </div>
      </div>

        <div class="card-tags">
          <span class="badge badge-ethnicity">${m.ethnicity}</span>
          ${m.talent ? `<span class="talent-pill">🎤 ${m.talent_desc||'Talent'}</span>` : ''}

        <div class="card-detail-row"><span>Height</span><span>${m.height||'—'}</span></div>

async function toggleApprove(name) {
  const db = modelData[name] || {};
  const newVal = !db.approved;
  const ok = await upsertModelProfile(name, { approved: newVal });
  if (ok) {
    toast(`${name} ${newVal?'approved ✓':'unapproved'}`, !newVal);
    renderModelCards();
  }
}

async function assignStaff(name, field, value) {
  const ok = await upsertModelProfile(name, { [field]: value });

    renderModelCards();
  }

async function addTag(name) {
  const key = name.replace(/\s/g,'_');
  const input = document.getElementById(`tag-input-${key}`);
  const val = input.value.trim();
  if (!val) return;
  const db = modelData[name] || {};
  const tags = [...(db.tags||[])];
  if (!tags.includes(val)) tags.push(val);
  await upsertModelProfile(name, { tags });
  input.value = '';
  document.getElementById(`tags-display-${key}`).innerHTML =
    tags.map(t=>`<button class="tag-remove" onclick="removeTag('${name}','${t}')">${t}<span class="x">×</span></button>`).join('');
  toast(`Tag added: ${val}`);
}

async function removeTag(name, tag) {
  const db = modelData[name] || {};
  const tags = (db.tags||[]).filter(t=>t!==tag);
  await upsertModelProfile(name, { tags });
  const key = name.replace(/\s/g,'_');
  if (document.getElementById(`tags-display-${key}`)) {
    document.getElementById(`tags-display-${key}`).innerHTML =
      tags.map(t=>`<button class="tag-remove" onclick="removeTag('${name}','${t}')">${t}<span class="x">×</span></button>`).join('');
  }
}

async function saveNotes(name) {
  const key = name.replace(/\s/g,'_');
  const el = document.getElementById(`notes-${key}`);
  if (!el) return;
  await upsertModelProfile(name, { notes: el.value });
  toast('Notes saved');
}

          ${db.hair_stylist ? `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:13px"><div style="font-size:10px;color:var(--text-dim);margin-bottom:3px">HAIR</div>${db.hair_stylist}</div>` : ''}
          ${db.mua ? `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:13px"><div style="font-size:10px;color:var(--text-dim);margin-bottom:3px">MAKEUP</div>${db.mua}</div>` : ''}
        </div>` : ''}

        ${db.notes ? `
        <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--text-dim);margin-bottom:10px;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--border)">Notes from Team</div>
        <div style="font-size:14px;margin-bottom:28px">${db.notes}</div>` : ''}

        <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--text-dim);margin-bottom:14px;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--border)">Upload Photos</div>
        <p style="font-size:13px;color:var(--text-dim);margin-bottom:16px">Upload your base fit photos, hair inspo, and makeup inspo below.</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label>Base Fit Photos</label>
            <div class="photo-upload-area" onclick="document.getElementById('upload-fit').click()">
              <input type="file" id="upload-fit" multiple accept="image/*" onchange="handleUpload(this,'fit','${name}')"/>
              <div style="font-size:24px;margin-bottom:6px">📸</div>
              <div style="font-size:13px">Tap to upload fits</div>
            </div>
          </div>
          <div>
            <label>Hair Inspo</label>
            <div class="photo-upload-area" onclick="document.getElementById('upload-hair').click()">
              <input type="file" id="upload-hair" multiple accept="image/*" onchange="handleUpload(this,'hair','${name}')"/>
              <div style="font-size:24px;margin-bottom:6px">💇</div>
              <div style="font-size:13px">Tap to upload</div>
            </div>
          </div>
          <div>
            <label>Makeup Inspo</label>
            <div class="photo-upload-area" onclick="document.getElementById('upload-mua').click()">
              <input type="file" id="upload-mua" multiple accept="image/*" onchange="handleUpload(this,'mua','${name}')"/>
              <div style="font-size:24px;margin-bottom:6px">💄</div>
              <div style="font-size:13px">Tap to upload</div>
            </div>
          </div>
        </div>
        <div id="upload-status" style="font-size:13px;color:var(--text-dim);margin-top:12px"></div>

        ${(db.photos||[]).length > 0 ? `
        <div style="margin-top:24px">
          <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--text-dim);margin-bottom:10px;text-transform:uppercase">Uploaded</div>
          <div class="photo-grid">${(db.photos||[]).map(u=>`<div class="photo-thumb"><img src="${u}"/></div>`).join('')}</div>
        </div>` : ''}
      </div>
    </div>
  `;
}

async function handleUpload(input, type, modelName) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const status = document.getElementById('upload-status');
  status.textContent = 'Uploading…';
  const urls = [];
  for (const file of files) {
    const path = `${modelName.replace(/\s/g,'_')}/${type}/${Date.now()}_${file.name}`;
    const { data, error } = await sb.storage.from('model-photos').upload(path, file, { upsert: true });
    if (!error) {
      const { data: { publicUrl } } = sb.storage.from('model-photos').getPublicUrl(path);
      urls.push(publicUrl);
    }
  }
  const db = modelData[modelName] || {};
  const existing = db.photos || [];
  await upsertModelProfile(modelName, { photos: [...existing, ...urls] });
  status.textContent = `✓ ${urls.length} photo(s) uploaded`;
  toast('Photos uploaded ✓');
}

// ============================================================
// AUTH
============================================================ */
function showAuthTab(tab) {
  document.getElementById('tab-signin').classList.toggle('hidden', tab !== 'signin');
  document.getElementById('tab-signup').classList.toggle('hidden', tab !== 'signup');
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='signin')||(i===1&&tab==='signup')));
}

function onRoleChange() {
  const role = document.getElementById('su-role').value;
  document.getElementById('model-name-group').classList.toggle('hidden', role !== 'model');
  document.getElementById('staff-name-group').classList.toggle('hidden', role !== 'staff');
  document.getElementById('su-user-group').classList.toggle('hidden', !role);
  document.getElementById('su-pass-group').classList.toggle('hidden', !role);
  document.getElementById('su-btn').classList.toggle('hidden', !role);
}

// Username → fake internal email (never shown to user)
function toEmail(username) {
  return `${username.toLowerCase().replace(/[^a-z0-9._-]/g,'')}@vdg.internal`;
}

async function signIn() {
  const username = document.getElementById('si-username').value.trim().toLowerCase();
  const pass = document.getElementById('si-pass').value;
  document.getElementById('si-error').textContent = '';
  if (!username) { document.getElementById('si-error').textContent = 'Enter your username.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email: toEmail(username), password: pass });
  if (error) document.getElementById('si-error').textContent = 'Username or password is incorrect.';
}

async function signUp() {
  const role = document.getElementById('su-role').value;
  const username = document.getElementById('su-username').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
  const pass = document.getElementById('su-pass').value;
  document.getElementById('su-error').textContent = '';

  if (!username) { document.getElementById('su-error').textContent = 'Choose a username.'; return; }
  if (pass.length < 6) { document.getElementById('su-error').textContent = 'Password must be at least 6 characters.'; return; }

  let displayName = '';
  let staffTitle = '';
  if (role === 'model') {
    displayName = document.getElementById('su-model-name').value;
    if (!displayName) { document.getElementById('su-error').textContent = 'Please select your name.'; return; }
  } else if (role === 'staff') {
    const sel = document.getElementById('su-staff-name').value;
    if (!sel) { document.getElementById('su-error').textContent = 'Please select your name.'; return; }
    displayName = sel.split(' — ')[0];
    staffTitle = sel.split(' — ')[1] || '';
  }

  const { error } = await sb.auth.signUp({
    email: toEmail(username),
    password: pass,
    options: { data: { role, display_name: displayName, staff_title: staffTitle, username } }
  });
  if (error) { document.getElementById('su-error').textContent = error.message; return; }
  toast('Account created! Signing you in…');
  // Auto sign in after signup
  await sb.auth.signInWithPassword({ email: toEmail(username), password: pass });
}

async function signOut() {
  await sb.auth.signOut();
}

function showAuthScreen() {
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  currentUser = null;
  currentRole = null;
  modelData = {};
}

// ============================================================
// MOBILE SIDEBAR
============================================================ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

// ============================================================
// TOAST
============================================================ */
let toastTimer;
function toast(msg, isError=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError?' error':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}
</script>
